        border: 1px solid #d8dee8;

        padding: 1rem 1.25rem;
        margin-bottom: 1rem;

      .muted,

      small {
        display: block;
      }
      .kpis {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
        gap: 0.7rem;
      }
      .kpi {
        background: #eef4ff;
        padding: 0.8rem;
        border-radius: 0.4rem;
      }
      .kpi strong,

        display: block;

        flex-wrap: wrap;
        gap: 0.7rem;
        align-items: end;

        flex-direction: column;
        font-size: 0.9rem;
      }
      .filters input,

        padding: 0.45rem;
        min-width: 9rem;
      }
      .row-count {
        margin-left: auto;
        font-weight: 600;
      }
      .table-scroll {
        overflow-x: auto;
      }
      table {
        border-collapse: collapse;
        width: 100%;
        margin-top: 0.8rem;
      }
      th,
      td {
        border: 1px solid #d8dee8;
        padding: 0.5rem;
        text-align: left;
        vertical-align: top;
      }
      th {
        background: #edf1f6;
      }
      .record-row > td:last-child {
        min-width: 32rem;
      }
      details {
        margin-top: 0.5rem;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
      }
      .details-grid {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 1rem;
      }
      .fields {
        margin: 0;
      }
      .field {
        display: grid;
        grid-template-columns: 9rem 1fr;
        border-bottom: 1px solid #edf0f4;
        padding: 0.3rem 0;
      }
      .field dt {
        font-weight: 600;
      }
      .field dd {
        margin: 0;
        white-space: pre-wrap;
        word-break: break-word;
      }
      .row-actions {
        display: flex;
        gap: 0.3rem;
        flex-wrap: wrap;
      }
      .row-actions button {
        padding: 0.3rem 0.45rem;
      }
      .highlight {
        outline: 4px solid #e0a400;
        outline-offset: 3px;
      }
      @media (max-width: 800px) {
        main {
          padding: 0.75rem;
        }
        .details-grid {
          grid-template-columns: 1fr;
        }

          min-width: 20rem;

          "sfg-fff7e77ba227b46ed80e": "part-004.html",
          "sfg-fff84775028e087d3618": "part-004.html",
          "sfg-fffde42b872e4a7c6f41": "part-004.html",
        };
        const buttons = [...document.querySelectorAll("[data-report-issue]")];
        function norm(x) {
          return (x || "").toString().toLowerCase().trim();
        }
        const controls = [...document.querySelectorAll("[data-filter]")],
          rows = [...document.querySelectorAll(".record-row")],
          count = document.querySelector("#row-count");
        function filter() {
          let shown = 0;
          rows.forEach((row) => {
            const keep = controls.every((control) => {
              const wanted = norm(control.value);
              if (!wanted) return true;
              const actual = norm(row.dataset[control.dataset.filter]);
              return control.dataset.filter === "search"
                ? actual.includes(wanted)
                : actual.split(" ").includes(wanted);
            });
            row.hidden = !keep;
            if (keep) shown++;
          });
          if (count) count.textContent = `${shown} / ${rows.length}`;
        }
        controls.forEach((x) => {
          x.addEventListener("input", filter);
          x.addEventListener("change", filter);
        });
        function copy(value) {
          if (navigator.clipboard) navigator.clipboard.writeText(value);
        }
        document
          .querySelectorAll("[data-copy-id]")
          .forEach((b) =>
            b.addEventListener("click", () => copy(b.dataset.copyId))
          );
        document
          .querySelectorAll("[data-copy-link]")
          .forEach((b) =>
            b.addEventListener("click", () =>
              copy(
                location.href.split("#")[0] +
                  "#record=" +
                  encodeURIComponent(b.dataset.copyLink)
              )
            )
          );
        document
          .querySelectorAll("[data-copy-correction]")
          .forEach((b) =>
            b.addEventListener("click", () => copy(b.dataset.copyCorrection))
          );
        buttons.forEach((button) =>
          button.addEventListener("click", () => {
            const row = button.closest(".record-row"),
              url = new URL(button.dataset.reportIssue, location.href),
              query = new URLSearchParams(url.search),
              id = row.dataset.recordId,
              page =
                location.href.split("#")[0] +
                "#record=" +
                encodeURIComponent(id);
            const body = `## Spokenform Gold corpus report

Record ID: ${id}
Language: ${row.dataset.language}
Locale: ${row.dataset.locale}
Status: ${row.dataset.status}

Corpus page:
${page}

### Current record

Input:
> ${row.dataset.input}

Canonical:
> ${row.dataset.canonical}

### What looks wrong?

Please describe the issue here.`;
            query.set("title", "[Corpus] Possible error in " + id);
            query.set("body", body);
            url.search = query;
            location.href = url.toString();
          })
        );
        function route() {
          const id = decodeURIComponent(
            location.hash.replace(/^#(?:record=)?/, "")
          );
          if (id && routing[id]) {
            location.replace(routing[id] + "#record=" + encodeURIComponent(id));
            return;
          }
          rows.forEach((row) => row.classList.remove("highlight"));
          if (!id) return;
          const row = document.getElementById("record-" + id);
          if (row) {
            row.classList.add("highlight");
            row.scrollIntoView();
            row.querySelectorAll("details").forEach((x) => (x.open = true));
          }
        }
        filter();
        route();
        window.addEventListener("hashchange", route);
      </script>
    </main>
  </body>
</html>
