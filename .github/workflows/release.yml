name: publish benchmark release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: minor
        type: choice
        options:
          - patch
          - minor
          - major
      maturity:
        description: "Release maturity"
        required: true
        default: experimental
        type: choice
        options:
          - experimental
          - candidate
          - stable
      coverage_profile:
        description: "Independent language coverage profile"
        required: true
        default: all-active
        type: choice
        options:
          - none
          - stable
          - cjk-experimental
          - all-active

permissions:
  contents: write

concurrency:
  group: spokenform-gold-release
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.13"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      maturity: ${{ steps.version.outputs.maturity }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      coverage_profile: ${{ steps.inputs.outputs.coverage_profile }}
      builder_commit: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch tags
        run: git fetch --force --tags origin
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Record builder commit
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Record release inputs
        id: inputs
        env:
          COVERAGE_PROFILE: ${{ inputs.coverage_profile }}
        run: echo "coverage_profile=${COVERAGE_PROFILE}" >> "$GITHUB_OUTPUT"
      - name: Plan release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          MATURITY: ${{ inputs.maturity }}
        run: |
          python scripts/next_release_version.py \
            --tags-from-git \
            --bump "$BUMP" \
            --maturity "$MATURITY" \
            --github-output "$GITHUB_OUTPUT"

  candidate:
    needs: plan
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.builder_commit }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate repository
        run: make check
      - name: Release preflight
        run: |
          mkdir -p dist
          spokenform-gold release-preflight \
            --data data/corpus/ \
            --source-decisions release/source-release-decisions.json \
            --out dist/release-preflight.json
      - name: Verify release preflight
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("dist/release-preflight.json").read_text())
          if not report["ready"] or report["blocked"] != 0:
              raise SystemExit("release preflight is blocked")
          if report["accounted"] != report["canonical_records"]:
              raise SystemExit("release preflight accounting is incomplete")
          print({key: report[key] for key in ("canonical_records", "embedded", "external_ref", "excluded", "blocked")})
          PY
      - name: Build release candidate
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MATURITY: ${{ needs.plan.outputs.maturity }}
          COVERAGE_PROFILE: ${{ needs.plan.outputs.coverage_profile }}
        run: |
          set -euo pipefail
          name="spokenform-gold-v${VERSION}"
          spokenform-gold release \
            --version "${VERSION}" \
            --data data/corpus/ \
            --controls data/controls \
            --maturity "${MATURITY}" \
            --coverage-profile "${COVERAGE_PROFILE}" \
            --conflict-adjudication release/conflict-adjudication.json \
            --source-decisions release/source-release-decisions.json \
            --out "dist/${name}"
      - name: Package deterministic candidate
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: python scripts/package_release.py "dist/spokenform-gold-v${VERSION}"
      - name: Verify candidate
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from spokenform_gold.benchmark import verify_release

          version = os.environ["VERSION"]
          root = Path("dist") / f"spokenform-gold-v{version}"
          verification = verify_release(root)
          if verification["manifest"]["benchmark_version"] != version:
              raise SystemExit("candidate version mismatch")
          print(verification["manifest_hash"])
          PY
      - name: Set candidate identity
        id: identity
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          COMMIT: ${{ needs.plan.outputs.builder_commit }}
        run: echo "artifact_name=spokenform-gold-candidate-${TAG}-${COMMIT}" >> "$GITHUB_OUTPUT"
      - name: Upload immutable candidate
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          if-no-files-found: error
          path: |
            dist/spokenform-gold-v${{ needs.plan.outputs.version }}
            dist/spokenform-gold-v${{ needs.plan.outputs.version }}.tar.gz
            dist/spokenform-gold-v${{ needs.plan.outputs.version }}.zip
            dist/spokenform-gold-v${{ needs.plan.outputs.version }}-archive-SHA256SUMS
            dist/spokenform-gold-v${{ needs.plan.outputs.version }}-manifest.json
            dist/spokenform-gold-v${{ needs.plan.outputs.version }}-SHA256SUMS

  consumer-gate:
    needs: [plan, candidate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.builder_commit }}
      - uses: actions/checkout@v4
        with:
          repository: buchwandler/spokenform
          path: spokenform
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: candidate
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install exact producer runtime and consumer
        working-directory: spokenform
        run: |
          python -m pip install -e ../.
          python -m pip install -e ".[dev]"
      - name: Run Spokenform consumer gate
        working-directory: spokenform
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python -m benchmarks.spokenform_gold \
            --gold-root "../candidate/spokenform-gold-v${VERSION}" \
            --split corpus \
            --accept-upstream-licenses \
            --report none

  publish:
    needs: [plan, candidate, consumer-gate]
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.builder_commit }}
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact_name }}
          path: candidate
      - name: Verify candidate bytes
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from spokenform_gold.benchmark import verify_release

          version = os.environ["VERSION"]
          verify_release(Path("candidate") / f"spokenform-gold-v{version}")
          PY
      - name: Publish or verify immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          BUILDER_COMMIT: ${{ needs.plan.outputs.builder_commit }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          name="spokenform-gold-v${VERSION}"
          existing="$(mktemp -d)"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release download "${TAG}" \
              --pattern "${name}-manifest.json" \
              --pattern "${name}-archive-SHA256SUMS" \
              --dir "${existing}"
            python scripts/compare_release_candidate.py \
              "candidate/${name}" \
              "${existing}/${name}-manifest.json" \
              --candidate-checksums "candidate/${name}-archive-SHA256SUMS" \
              --existing-checksums "${existing}/${name}-archive-SHA256SUMS"
            echo "Existing equivalent release is immutable and already published."
            exit 0
          fi
          args=(release create "${TAG}" \
            "candidate/${name}.tar.gz" \
            "candidate/${name}.zip" \
            "candidate/${name}-archive-SHA256SUMS" \
            "candidate/${name}-manifest.json" \
            "candidate/${name}-SHA256SUMS" \
            --title "Spokenform Gold ${VERSION}" \
            --notes-file "candidate/${name}/RELEASE_NOTES.md" \
            --target "${BUILDER_COMMIT}")
          if [[ "${PRERELEASE}" == "true" ]]; then args+=(--prerelease); fi
          gh "${args[@]}"

  verify-published:
    needs: [plan, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.plan.outputs.builder_commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Download exact public assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          mkdir -p published
          gh release download "$TAG" \
            --pattern "spokenform-gold-v${VERSION}.zip" \
            --pattern "spokenform-gold-v${VERSION}-archive-SHA256SUMS" \
            --pattern "spokenform-gold-v${VERSION}.tar.gz" \
            --pattern "spokenform-gold-v${VERSION}-manifest.json" \
            --dir published
      - name: Verify transport and extracted release
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          (cd published && sha256sum -c "spokenform-gold-v${VERSION}-archive-SHA256SUMS")
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path
          from spokenform_gold.benchmark import verify_release

          version = os.environ["VERSION"]
          archive = Path("published") / f"spokenform-gold-v{version}.zip"
          destination = Path("published/extracted")
          with zipfile.ZipFile(archive) as bundle:
              for member in bundle.infolist():
                  name = member.filename.replace("\\\\", "/")
                  mode = member.external_attr >> 16
                  if (
                      name.startswith("/")
                      or ".." in Path(name).parts
                      or (mode and (mode & 0o170000) == 0o120000)
                  ):
                      raise SystemExit(f"unsafe public asset path: {member.filename}")
              bundle.extractall(destination)
          verify_release(destination / f"spokenform-gold-v{version}")
          PY
