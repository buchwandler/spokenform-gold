[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spokenform-gold"
version = "0.1.0"
description = "Canonical benchmark and oracle infrastructure for Spokenform text normalization"
requires-python = ">=3.10"
dependencies = [
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pre-commit>=3.7",
  "pytest>=8",
  "ruff>=0.16,<0.17",
]

[project.scripts]
spokenform-gold = "spokenform_gold.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
